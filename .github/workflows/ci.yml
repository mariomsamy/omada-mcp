name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint and type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Check global branch coverage
        run: node scripts/check-branch-coverage.mjs

      - name: Verify tool test coverage mapping
        run: node scripts/check-tool-tests.mjs

      - name: Verify README and generated docs sync
        run: node scripts/check-readme-sync.mjs

      - name: Release readiness checklist exists
        run: test -f docs/operations/release-readiness-checklist.md
